
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSOS SMS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:white;font-family:Arial,sans-serif}
header{background:#111e33;padding:20px;font-size:23px;font-weight:bold}
main{max-width:420px;margin:65px auto;padding:25px}
.card{background:#16243a;padding:25px;border-radius:15px}
h2{text-align:center;color:#42a5ff}
p{text-align:center;color:#a9b8cc}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #344760;border-radius:8px;background:#0b1220;color:white}
button{width:100%;padding:14px;background:#1684ed;color:white;border:0;border-radius:8px;font-size:16px;margin-top:12px}
.small{text-align:center;color:#8799b2;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<header>RSOS SMS</header>
<main>
<div class="card" id="login">
<h2>Welcome Back</h2>
<p>Login to your SMS dashboard</p>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p class="small">RSOS SMS Management Platform</p>
</div>
<div class="card" id="dashboard" hidden>
<h2>Dashboard</h2>
<p>Welcome to RSOS SMS Demo</p>
<h3>My Numbers: 0</h3>
<h3>SMS Received: 0</h3>
<h3>Balance: Demo</h3>
<button onclick="logout()">Logout</button>
</div>
</main>
<script>
function login(){
const u=document.getElementById('username').value;
const p=document.getElementById('password').value;
if(u==='demo' && p==='demo123'){
document.getElementById('login').hidden=true;
document.getElementById('dashboard').hidden=false;
}else{
alert('Demo login: username demo, password demo123');
}
}
function logout(){
document.getElementById('dashboard').hidden=true;
document.getElementById('login').hidden=false;
}
</script>
</body>
</html>
